global:
  scrape_interval: 5s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: "backend"
    static_configs:
      - targets:
          - backend:3001

  - job_name: "prometheus"
    static_configs:
      - targets:
          - localhost:9090

  - job_name: "grafana"
    static_configs:
      - targets:
          - grafana:3000
