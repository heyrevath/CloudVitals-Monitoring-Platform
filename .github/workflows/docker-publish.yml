name: Docker Publish

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Backend
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/cloudvitals-backend:latest ./server

      - name: Push Backend
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/cloudvitals-backend:latest

      - name: Build Frontend
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/cloudvitals-frontend:latest ./frontend

      - name: Push Frontend
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/cloudvitals-frontend:latest
