name: CloudVitals CI

on:
  push:
    branches:
      - main

jobs:
  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run build

  backend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: node --check server.js

  docker-build:
    runs-on: ubuntu-latest

    needs:
      - frontend-build
      - backend-build

    steps:
      - uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build -t cloudvitals-backend ./backend

      - name: Build Frontend Image
        run: docker build -t cloudvitals-frontend ./frontend
