name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/CloudVitals-Monitoring-Platform

            git pull origin main

            docker compose down

            docker compose up -d --build

  health-check:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for services to start
        run: sleep 20

      - name: Check Backend API health
        run: |
          curl --fail http://${{ secrets.EC2_HOST }}:3001/health || exit 1

      - name: Check Prometheus health
        run: |
          curl --fail http://${{ secrets.EC2_HOST }}:9090/-/healthy || exit 1

      - name: Check Alertmanager health
        run: |
          curl --fail http://${{ secrets.EC2_HOST }}:9093/-/healthy || exit 1
